name: Mise à jour du flux de veille

on:
  schedule:
    # Toutes les heures à :40 (UTC), avant chaque édition de la veille (déclenchée à :54, heure de Paris).
    # '40 3-21' UTC couvre 05h40 → 22h40 à Paris en hiver (UTC+1) comme en été (UTC+2),
    # donc toutes les éditions de 06h à 23h. GitHub peut retarder le départ de quelques minutes.
    - cron: '40 3-21 * * *'
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main (l'agent de veille l'utilise aussi si le flux est trop ancien)

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install feedparser requests beautifulsoup4

      - name: Collecter les flux
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python collect_feeds.py

      - name: Publier flux_2h.md et l'état (etat/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flux_2h.md flux_delta.md etat/
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Flux de veille : $(TZ=Europe/Paris date '+%d/%m %Hh%M')"
          # L'agent de veille écrit etat/traites.jsonl pendant la journée : on se recale avant de pousser.
          # GitHub renvoie parfois des erreurs serveur transitoires (500, « fatal error in commit_refs_rules ») :
          # on réessaie avec une attente croissante, et on fait ÉCHOUER le job si le push n'a jamais abouti
          # (avant ce correctif, l'échec était silencieux et le run apparaissait « success »).
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push réussi (tentative $i)."
              exit 0
            fi
            echo "Push refusé (tentative $i), nouvel essai dans $((i*15)) s."
            sleep $((i*15))
          done
          echo "::error::Impossible de publier flux_2h.md après 6 tentatives"
          exit 1
