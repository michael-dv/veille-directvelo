name: Vérification des comptes Instagram

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Vérifier les comptes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/ig_check.py
      - name: Publier le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/instagram_check.json
          git commit -m "Vérification des comptes Instagram" || echo "Aucun changement."
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done
